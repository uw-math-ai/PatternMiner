# ML / training / interpretability environment (CUDA PyTorch).
# Create the env then pip-install the pinned wheels:
#   mamba create -n schubml python=3.11
#   conda run -n schubml pip install torch --index-url https://download.pytorch.org/whl/cu124
#   conda run -n schubml pip install -r requirements-ml.txt
# Verified on an AWS Tesla T4 (CUDA 12.5 toolkit, 13.0 driver).
name: schubml
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - --index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0
      - --extra-index-url https://pypi.org/simple
      - numpy==2.4.6
      - pandas==3.0.4
      - pyarrow==24.0.0
      - pyyaml==6.0.3
      - tqdm
      - einops==0.8.2
      - scikit-learn==1.9.0
      - scipy==1.17.1
      - xgboost==3.2.0
      - matplotlib
      - tensorboard
      - networkx
      - lightning==2.6.5
      - pytest
