name: full_multitask
optimizer:
  name: adamw
  lr: 0.0004
  weight_decay: 0.01
scheduler:
  name: cosine_with_warmup
  warmup_steps: 1000
batching:
  batch_size: 384
  max_tokens: 8192
curriculum: combined
max_steps: 40000
loss_weights:
  positivity: 1.0
  coeff_bin: 0.5
  log_coeff_huber: 0.3
  mod_heads: 0.1
  exact_small: 0.3
  listwise_support: 1.0
  auxiliary: 0.2
  slot_sparsity: 0.01
  slot_diversity: 0.01
  zero_query: 0.1
tier_weights:
  Z0: 0.2
  Z1: 0.2
  Z2: 0.4
  Z3: 1.0
  Z4: 1.5
  Z5: 2.0
logging:
  log_every_steps: 50
  eval_every_steps: 1000
  save_every_steps: 2000
  cache_interpretability_batches: true
precision: 16-mixed
grad_clip: 1.0
